<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Premier One Mobile Client</title>
    <link rel="stylesheet" href="https://cdn.metroui.org.ua/current/metro.css">
    <link rel="stylesheet" href="https://cdn.metroui.org.ua/current/icons.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body class="booting">
    <div id="bootscreen" class="is-active" aria-hidden="true">
        <div class="boot-logo">
            <img class="win10-logo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'><rect x='6' y='8' width='30' height='30' fill='%2300A4EF'/><rect x='44' y='8' width='30' height='30' fill='%23008FD6'/><rect x='6' y='42' width='30' height='30' fill='%230077C4'/><rect x='44' y='42' width='30' height='30' fill='%230061A6'/></svg>" alt="Windows">
        </div>
        <div class="boot-loader">
            <div class="boot-circle"></div>
            <div class="boot-circle"></div>
            <div class="boot-circle"></div>
            <div class="boot-circle"></div>
            <div class="boot-circle"></div>
        </div>
    </div>

    <header class="metro-app-bar" id="titleBar">

        <div class="app-branding">
            <img id="appIcon" src="https://web.opendrive.com/api/v1/download/file.json/MzRfMTAwNDg1ODM0Xw?inline=1&preview=1"
                height="16px" width="16px">
            <h1 class="app-title" id="appTitle">&ensp; PremierOne Mobile Client</h1>
        </div>

        <div class="window-actions">
            <button class="action-btn" id="winMinBtn" onclick="handleWindowMinimize()">&#xE921;</button>
            <button class="action-btn" id="winMaxBtn" onclick="handleWindowMaximize()">&#xE922;</button>
            <button class="action-btn close-btn" id="winCloseBtn" onclick="handleWindowClose()">&#xE8BB;</button>
        </div>

    </header>

    <div class="bg-grey" id="loginArea">
        <div id="win-logon-card">
            <div class="avatar">
                <img alt="profile"
                    src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256' viewBox='0 0 256 256'><circle cx='128' cy='128' r='128' fill='%23d0d0d0'/><circle cx='128' cy='85' r='45' fill='%23a0a0a0'/><path d='M 60 180 Q 60 140 128 140 Q 196 140 196 180 L 196 200 Q 196 220 180 220 L 76 220 Q 60 220 60 200 Z' fill='%23a0a0a0'/></svg>"
                    style="width:96px;height:96px;display:block;" />
            </div>
            <div class="username">User</div>
            <div id="win-pwd-container" style="display:flex;flex-direction:column;gap:8px">
                <input id="win-pwd" type="password" placeholder="Enter password" aria-label="password"
                    onkeydown="if(event.key=== 'Enter')tryLogin();">
                <div id="win-logon-error"></div>
            </div>
            <div id="win-loading-container">
                <div class="win-spinner-small"></div>
                <div class="win-welcome-small">Welcome</div>
            </div>
        </div>

        <div id="win-loader">
            <div class="win-welcome">Welcome</div>
            <div class="win-spinner"></div>
        </div>

        <!-- Bottom Right Buttons -->
        <div id="win-bottom-buttons">
            <!-- WiFi Button -->
            <div style="position: relative;">
                <button class="win-btn-icon" id="win-wifi-btn" style="background: transparent;" onclick="toggleWifiMenu(event)" title="WiFi">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.94 0M12 20h.01">
                        </path>
                    </svg>
                </button>
                <div class="win-popup-menu" id="win-wifi-menu" style="min-width: 280px;" >
                    <!-- Connected Network Header -->
                    <div
                        style="padding: 12px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.15); background: rgba(0, 120, 212, 0.2);">
                        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
                            <div style="flex: 1;">
                                <div style="color: rgba(230, 238, 248, 0.95); font-size: 14px; font-weight: 500;">
                                    06-83013-CFES2015</div>
                                <div style="color: rgba(0, 200, 100, 0.9); font-size: 12px; margin-top: 2px;">Connected,
                                    secured</div>
                            </div>
                        </div>
                        <div style="display: flex; gap: 8px; margin-top: 10px;">
                            <button class="win-wifi-action-btn" onclick="event.stopPropagation();">Disconnect</button>
                            <button class="win-wifi-action-btn" onclick="event.stopPropagation();">Properties</button>
                        </div>
                    </div>
                    <!-- Available Networks -->
                    <div style="max-height: 220px; overflow-y: auto;">
                        <button class="win-wifi-network-item" onclick="launchDispatchFromWifi(event)">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" style="margin-right: 8px; flex-shrink: 0;">
                                <path
                                    d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.94 0M12 20h.01">
                                </path>
                            </svg>
                            HWD Staff WiFi
                            <span style="font-size: 11px; color: rgba(200, 200, 200, 0.8);">Secured</span>
                        </button>
                        <button class="win-wifi-network-item" onclick="event.stopPropagation();">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" style="margin-right: 8px; flex-shrink: 0;">
                                <path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.94 0M12 20h.01"></path>
                            </svg>
                            HWD Public WiFi
                            <span style="font-size: 11px; color: rgba(200, 200, 200, 0.8);">Secured</span>
                        </button>

                        <button class="win-wifi-network-item" onclick="event.stopPropagation();">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" style="margin-right: 8px; flex-shrink: 0;">
                                <path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.94 0M12 20h.01"></path>
                            </svg>Guzzi's Gay Sex Hotspot <span style="font-size: 11px; color: rgba(200, 200, 200, 0.8);">Secured</span>
                        </button>

                        <button class="win-wifi-network-item" onclick="event.stopPropagation();">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" style="margin-right: 8px; flex-shrink: 0;">
                                <path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.94 0M12 20h.01"></path>
                            </svg>connect to me :) <span style="font-size: 11px; color: rgba(200, 200, 200, 0.8);">Secured</span>
                        </button>
                        <button class="win-wifi-network-item" onclick="event.stopPropagation();">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" style="margin-right: 8px; flex-shrink: 0;">
                                <path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.94 0M12 20h.01"></path>
                            </svg>STARLINK59295835 <span style="font-size: 11px; color: rgba(200, 200, 200, 0.8);"></span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Accessibility Button -->
            <button class="win-btn-icon" id="win-a11y-btn" title="Accessibility" style="background: transparent;" onclick="toggleA11yMenu(event)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="1"></circle>
                    <path d="M12 11v6M9 3h6v7H9z M3 19h18M5 19v-2a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v2"></path>
                </svg>
            </button>

            <!-- Power Button -->
            <div style="position: relative; background: transparent;" >
                <button class="win-btn-icon" id="win-power-btn" onclick="togglePowerMenu(event)" title="Power">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10"></path>
                    </svg>
                </button>
                <div class="win-popup-menu" id="win-power-menu">
                    <button class="win-menu-item win-power-action" data-power-action="lock" onclick="powerAction('lock')">Lock</button>
                    <button class="win-menu-item win-power-action" data-power-action="sleep" onclick="powerAction('sleep')">Sleep</button>
                    <button class="win-menu-item win-power-action" data-power-action="shutdown" onclick="powerAction('shutdown')">Shut down</button>
                    <button class="win-menu-item win-power-action" data-power-action="restart" onclick="powerAction('restart')">Restart</button>
                </div>
            </div>
        </div>
    </div>

    <div id="windowsHome" style="display:none;">
        <div class="win-home-overlay"></div>
        <div class="win-desktop-icons" id="desktopIconsHost"></div>

        <div id="startMenu" class="win-start-menu">
            <div class="win-start-search"><input type="text" placeholder="Type here to search" readonly></div>
            <div class="win-start-head">Pinned</div>
            <div class="win-start-grid" id="startMenuGrid"></div>
            <div class="win-start-foot">
                <span>User</span>
                <div class="win-start-power-wrap">
                    <button title="Power" onclick="toggleStartPowerMenu(event)"><span class="mif-power"></span></button>
                    <div id="startPowerMenu" class="win-start-power-menu">
                        <button class="win-power-action" data-power-action="lock" onclick="powerAction('lock')">Lock</button>
                        <button class="win-power-action" data-power-action="sleep" onclick="powerAction('sleep')">Sleep</button>
                        <button class="win-power-action" data-power-action="shutdown" onclick="powerAction('shutdown')">Shut down</button>
                        <button class="win-power-action" data-power-action="restart" onclick="powerAction('restart')">Restart</button>
                    </div>
                </div>
            </div>
        </div>

        <nav id="desktopContextMenu" class="win-context-menu" aria-hidden="true">
            <button><span class="win-context-menu-icon">▥</span><span class="win-context-menu-label">View</span><span class="win-context-menu-chevron">›</span></button>
            <button><span class="win-context-menu-icon">↕</span><span class="win-context-menu-label">Sort by</span><span class="win-context-menu-chevron">›</span></button>
            <button><span class="win-context-menu-icon">↻</span><span class="win-context-menu-label">Refresh</span></button>
            <hr>
            <button><span class="win-context-menu-icon">＋</span><span class="win-context-menu-label">New</span><span class="win-context-menu-chevron">›</span></button>
            <hr>
            <button><span class="win-context-menu-icon">🖵</span><span class="win-context-menu-label">Display settings</span></button>
            <button><span class="win-context-menu-icon">🎨</span><span class="win-context-menu-label">Personalize</span></button>
        </nav>

        <div class="win-taskbar acrylic">
            <div class="win-taskbar-left">
                <button class="win-task-btn" id="startMenuTrigger" aria-label="Windows" onclick="toggleStartMenu(event)">
                    <img class="win10-logo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'><rect x='6' y='8' width='30' height='30' fill='%2300A4EF'/><rect x='44' y='8' width='30' height='30' fill='%23008FD6'/><rect x='6' y='42' width='30' height='30' fill='%230077C4'/><rect x='44' y='42' width='30' height='30' fill='%230061A6'/></svg>" alt="Windows">
                </button>
                <label class="win-task-search-wrap" aria-label="Search">
                    <span class="mif-search"></span>
                    <input class="win-task-search" type="text" placeholder="Search" readonly>
                </label>
                <div id="taskbarPinnedHost" class="win-taskbar-pinned"></div>
            </div>
            <div class="win-taskbar-right">
                <button class="win-task-btn" id="taskbarNetworkBtn" aria-label="Network">
                    <span class="mif-wifi-full"></span>
                </button>
                <button class="win-task-btn" id="taskbarHiddenIconsBtn" aria-label="Hidden Icons">
                    <span class="mif-arrow-drop-up"></span>
                </button>
                <button class="win-task-btn" id="taskbarSoundBtn" aria-label="Sound" onclick="toggleGlobalMute()">
                    <span class="mif-volume-high" id="taskbarSoundIcon"></span>
                </button>
                <div class="win-task-datetime">
                    <div id="winHomeTime">00:00</div>
                    <div id="winHomeDate">01/01/2000</div>
                </div>
            </div>
        </div>
    </div>

    <div id="simpleDesktopWindow" style="display:none;">
        <div id="simpleDesktopTitle" style="display:none;">Desktop App</div>
        <div id="simpleDesktopBody"></div>
    </div>

    <app id="premierOneApp" style="display: none;">
    <div id="appContentMount"></div>
</app>
